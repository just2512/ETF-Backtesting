name: NovAPI cloud real-data import

on:
  push:
    branches: [main, "fix/**"]
  workflow_dispatch:
  schedule:
    - cron: "17 1 * * 1-5"

permissions:
  contents: read

jobs:
  real-data:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      STOCKSDK_MODULE: stock_sdk
      STOCKSDK_ONLINE_ENDPOINT: 106.75.217.246:12328
      STOCKSDK_INIT_NATIVE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project dependencies
        run: python -m pip install -e ".[dev]"
      - name: Install and verify official Linux NovAPI SDK
        id: sdk_install
        run: bash scripts/install_novapi_sdk.sh
      - name: Probe five ETF histories from the real online API
        id: probe
        run: |
          python scripts/probe_stock_sdk.py \
            --symbols 510300 510880 513020 159928 159611 \
            --output reports/novapi/stock_sdk_probe.json
      - name: Export five ETF full-history snapshots
        if: always() && steps.sdk_install.outcome == 'success'
        run: |
          python scripts/export_remote_history.py \
            --symbols 510300 510880 513020 159928 159611 \
            --start 20000101 \
            --end "$(date -u +%Y%m%d)" \
            --retry-attempts 3 \
            --retry-delay-seconds 2 \
            --output reports/novapi/etf-history
      - name: Probe historical index constituents and weights
        if: always() && steps.sdk_install.outcome == 'success'
        run: |
          python scripts/probe_novapi_index_contract.py \\
            --index-id 000300.XSHG \\
            --dates 2020-06-30 2026-11-06 \\
            --output reports/novapi/index-api-contract.json
      - name: Import full historical index constituents and weights
        if: always() && steps.sdk_install.outcome == 'success'
        run: |
          python scripts/export_novapi_index_history.py \\
            --start 20220208 \\
            --end "$(date -u +%Y%m%d)" \\
            --retry-attempts 3 \\
            --retry-delay-seconds 2 \\
            --output data/snapshots/remote-stock-sdk/index-history
      - name: Upload real provider responses and audit manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: novapi-real-data-${{ github.run_id }}
          path: |\n            reports/novapi/\n            data/snapshots/remote-stock-sdk/
          if-no-files-found: warn
          retention-days: 30
