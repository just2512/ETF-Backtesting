free_stockdb:
  enabled: false
  status: "NOT_THE_ONLINE_PROVIDER"
  note: "Local StockDB storage/query engine is not the NovAPI online API."

stock_sdk:
  enabled: true
  provider: "NovAPI"
  transport: "stock_sdk.RemoteProxy"
  online_endpoint_env: "STOCKSDK_ONLINE_ENDPOINT"
  default_online_endpoint: "106.75.217.246:12328"
  sdk_module_env: "STOCKSDK_MODULE"
  default_sdk_module: "stock_sdk"
  native_local_channel_required: false
  native_init_opt_in_env: "STOCKSDK_INIT_NATIVE"
  daily_price_api: "get_price"
  daily_price_basis: "UNADJUSTED"
  daily_price_adjustment: "fq=None"
  trading_calendar_api: "get_trade_days"
  historical_index_constituents_api: "get_index_stocks"
  historical_index_weights_api: "get_index_weights"
  index_date_parameter: "date"
  index_snapshot_frequency: "MONTH_END_PLUS_RANGE_START"
  online_test_quota_requests: 2000
  online_test_quota_reset_hours: 24
  bulk_history_transport: "LOCAL_STOCKDB_OR_AUTHORIZED_MIRROR"
  index_code_suffix_required: ".XSHG"
  cash_dividend_events: "UNKNOWN"
  adjustment_factor_semantics: "UNKNOWN"

historical_index_data:
  provider: null
  status: "UNKNOWN"
  required_fields:
    - index_id
    - constituent_symbol
    - effective_from
    - effective_to
    - weight
    - source

trading_calendar:
  provider: null
  status: "UNKNOWN"
  required_fields:
    - market
    - trade_date
    - is_open


