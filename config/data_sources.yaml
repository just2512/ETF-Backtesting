free_stockdb:
  enabled: true
  transport: "HTTP"
  endpoint_env: "STOCKSDK_ONLINE_ENDPOINT"
  sdk_module_env: "STOCKSDK_MODULE"
  default_sdk_module: "etf_backtesting.adapters.free_stockdb_http_sdk"
  native_extension_required: false
  daily_bars_query: "cmd=get&t=日k:{symbol}:*"
  daily_price_basis: "UNADJUSTED"
  adjustment_factor_semantics: "UNVERIFIED"
  trading_calendar: "UNKNOWN"
  cash_dividend_endpoint: null
  historical_index_constituent_endpoint: null

historical_index_data:
  provider: null
  status: "UNKNOWN"
  required_fields:
    - index_id
    - constituent_symbol
    - effective_from
    - effective_to
    - weight
    - source

trading_calendar:
  provider: null
  status: "UNKNOWN"
  required_fields:
    - market
    - trade_date
    - is_open

stock_sdk:
  enabled: false
  host_env: "STOCKSDK_HOST"
  port_env: "STOCKSDK_PORT"
  default_port: 7899
  online_endpoint_env: "STOCKSDK_ONLINE_ENDPOINT"
  sdk_module_env: "STOCKSDK_MODULE"
  default_sdk_module: "stock_sdk"
  daily_price_basis: "UNADJUSTED"
  normalized_daily_api: "rd.get_data"
  native_daily_api: "rd.get"
  adjustment_factor_semantics: "UNKNOWN"
  cash_dividend_events: "UNKNOWN"
  historical_index_constituents: "UNKNOWN"
  fundamentals_and_ticks: "SUPPLEMENTAL_ONLY"
